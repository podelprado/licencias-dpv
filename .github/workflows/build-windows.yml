name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend deps
        run: npm install
        working-directory: backend

      - name: Install frontend deps
        run: npm install
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install electron deps
        run: npm install
        working-directory: electron

      # ── Build instalador SERVIDOR ──────────────────────────────────────────
      - name: Build Server installer
        run: npm run build:server
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # ── Cambiar licenciasMode a client y build instalador CLIENTE ──────────
      - name: Set client mode in package.json
        run: |
          $pkg = Get-Content electron/package.json | ConvertFrom-Json
          $pkg.licenciasMode = "client"
          $pkg | ConvertTo-Json -Depth 10 | Set-Content electron/package.json
        shell: pwsh

      - name: Build Client installer
        run: npm run build:client
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # ── Subir ambos instaladores ───────────────────────────────────────────
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: LicenciasDPV-Windows
          path: release/*.exe
          retention-days: 30

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
  <title>Configuración</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 100%);
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
      padding: 32px;
    }

    .logo {
      width: 56px; height: 56px;
      background: rgba(255,255,255,0.15);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
      font-size: 28px;
    }

    h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { font-size: 12px; opacity: 0.7; margin-bottom: 28px; }

    .card {
      background: rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      -webkit-app-region: no-drag;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      opacity: 0.85;
      margin-bottom: 8px;
      letter-spacing: 0.03em;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 6px;
    }

    input::placeholder { opacity: 0.45; }
    input:focus { border-color: rgba(255,255,255,0.6); }

    .hint {
      font-size: 11px;
      opacity: 0.55;
      margin-bottom: 20px;
    }

    .error {
      font-size: 12px;
      color: #fca5a5;
      margin-bottom: 12px;
      min-height: 16px;
    }

    button {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: white;
      color: #1d4ed8;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.88; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="logo">📅</div>
  <h1>Licencias DPV</h1>
  <p class="subtitle">Configuración inicial</p>

  <div class="card">
    <label>Dirección IP del servidor</label>
    <input
      id="ipInput"
      type="text"
      placeholder="Ej: 192.168.1.100"
      autofocus
    />
    <p class="hint">Ingresá la IP de la PC donde está instalado el servidor.</p>
    <p class="error" id="errorMsg"></p>
    <button id="btnConectar">Conectar</button>
  </div>

  <script>
    const input   = document.getElementById('ipInput');
    const btn     = document.getElementById('btnConectar');
    const errorEl = document.getElementById('errorMsg');

    function isValidIp(val) {
      const v = val.trim();
      if (!v) return false;
      // Acepta IP simple o con puerto: 192.168.1.1 o 192.168.1.1:8080
      return /^(\d{1,3}\.){3}\d{1,3}(:\d+)?$/.test(v) || /^localhost(:\d+)?$/.test(v);
    }

    function connect() {
      const val = input.value.trim();
      if (!isValidIp(val)) {
        errorEl.textContent = 'Ingresá una IP válida. Ej: 192.168.1.100';
        input.focus();
        return;
      }
      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Conectando...';
      window.electronAPI.saveServerUrl(val);
    }

    btn.addEventListener('click', connect);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });
  </script>
</body>
</html>

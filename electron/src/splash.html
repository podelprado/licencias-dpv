<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
  <title>Iniciando...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 100%);
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
    }

    .logo {
      width: 64px;
      height: 64px;
      background: rgba(255,255,255,0.15);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      font-size: 32px;
    }

    h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { font-size: 13px; opacity: 0.7; margin-bottom: 36px; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #status {
      font-size: 13px;
      opacity: 0.8;
      text-align: center;
      max-width: 340px;
      line-height: 1.5;
    }

    /* Error state */
    .error-box {
      display: none;
      background: rgba(0,0,0,0.25);
      border-radius: 12px;
      padding: 20px 24px;
      max-width: 380px;
      text-align: center;
    }

    .error-box p {
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-line;
      margin-bottom: 16px;
      opacity: 0.9;
    }

    .btn-row { display: flex; gap: 10px; justify-content: center; -webkit-app-region: no-drag; }

    button {
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }

    .btn-primary { background: white; color: #1d4ed8; }
    .btn-secondary { background: rgba(255,255,255,0.15); color: white; }
  </style>
</head>
<body>
  <div class="logo">📅</div>
  <h1>Licencias DPV</h1>
  <p class="subtitle">Sistema de Gestión de Licencias</p>

  <div id="loading">
    <div class="spinner"></div>
    <p id="status">Iniciando...</p>
  </div>

  <div class="error-box" id="errorBox">
    <p id="errorMsg"></p>
    <div class="btn-row">
      <button class="btn-primary" id="btnDocker">Descargar Docker</button>
      <button class="btn-secondary" id="btnRetry">Reintentar</button>
      <button class="btn-secondary" id="btnChange" style="display:none">Cambiar servidor</button>
    </div>
  </div>

  <script>
    window.electronAPI.onStatus((msg) => {
      document.getElementById('status').textContent = msg;
    });

    window.electronAPI.onError((msg) => {
      document.getElementById('loading').style.display = 'none';
      const box = document.getElementById('errorBox');
      box.style.display = 'block';
      document.getElementById('errorMsg').textContent = msg;
      // Mostrar "Cambiar servidor" solo si el error menciona conexión
      if (msg.includes('servidor') || msg.includes('conectar')) {
        document.getElementById('btnDocker').style.display = 'none';
        document.getElementById('btnChange').style.display = 'inline-block';
      }
    });

    document.getElementById('btnDocker').addEventListener('click', () => {
      window.electronAPI.openDockerUrl();
    });

    document.getElementById('btnRetry').addEventListener('click', () => {
      window.electronAPI.retry();
    });

    document.getElementById('btnChange').addEventListener('click', () => {
      window.electronAPI.changeServer();
    });
  </script>
</body>
</html>

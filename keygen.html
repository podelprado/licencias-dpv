<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador de clave — Licencias DPV</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; background: #f5f5f5; }
    h1 { font-size: 1.3rem; color: #1e3a5f; }
    label { display: block; font-size: .85rem; color: #555; margin-bottom: 4px; margin-top: 16px; }
    input { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
    button { margin-top: 20px; width: 100%; padding: 10px; background: #1e3a5f; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #2a4f80; }
    #resultado { margin-top: 24px; padding: 16px; background: #fff; border-radius: 8px; border: 1px solid #ddd; display: none; }
    #clave { font-size: 2rem; font-family: monospace; letter-spacing: 4px; color: #1e3a5f; font-weight: bold; }
    #info { font-size: .8rem; color: #888; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>🔑 Generador de clave — Licencias DPV</h1>
  <p style="font-size:.85rem;color:#666">Ingresá el secreto base configurado en el backend para obtener la clave vigente de esta semana.</p>

  <label>Secreto base</label>
  <input type="password" id="secreto" placeholder="dpv-licencias-secret-2024" />

  <button onclick="generar()">Generar clave</button>

  <div id="resultado">
    <div style="font-size:.8rem;color:#888;margin-bottom:6px">Clave vigente esta semana:</div>
    <div id="clave"></div>
    <div id="info"></div>
  </div>

  <script>
    async function hmacSha256(secret, message) {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey(
        'raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
      );
      const sig = await crypto.subtle.sign('HMAC', key, enc.encode(message));
      return Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function getWeekNumber(date) {
      const startOfYear = new Date(date.getFullYear(), 0, 1);
      return Math.ceil(((date - startOfYear) / 86400000 + startOfYear.getDay() + 1) / 7);
    }

    async function generar() {
      const secreto = document.getElementById('secreto').value.trim();
      if (!secreto) { alert('Ingresá el secreto base'); return; }

      const now = new Date();
      const year = now.getFullYear();
      const week = getWeekNumber(now);
      const payload = `${secreto}:${year}:${week}`;
      const hash = await hmacSha256(secreto, payload);
      const clave = hash.substring(0, 12).toUpperCase();

      document.getElementById('clave').textContent = clave;
      document.getElementById('info').textContent = `Semana ${week} de ${year} · Válida hasta el próximo lunes`;
      document.getElementById('resultado').style.display = 'block';
    }
  </script>
</body>
</html>
